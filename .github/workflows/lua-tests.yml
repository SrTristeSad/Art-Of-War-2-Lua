name: Lua core regressions
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Validate Lua syntax
        run: find . -name '*.lua' -not -path './assets/*' -print0 | xargs -0 -n 1 luac5.3 -p
      - name: Test simulation, pathfinding and saving
        run: lua5.3 tests/core_regression.lua
      - name: Test sprites and visual events (mock)
        run: lua5.3 tests/visual_regression.lua
      - name: Test atlas inspection and depth rendering (mock)
        run: |
          lua5.3 tests/atlas_regression.lua
          lua5.3 tests/regions_regression.lua
          lua5.3 tests/depth_regression.lua
          lua5.3 tests/atlas_quads_regression.lua
      - name: Install Pillow for atlas export tests
        run: python3 -m pip install pillow
      - name: Verify atlas crop export
        run: python3 -m unittest discover -s tests -p export_atlas_regression.py
          python3 -m unittest discover -s tests -p provenance_regression.py
          python3 tools/verify_sprite_provenance.py
      - name: Verify source atlas fingerprints
        run: python3 tools/inventory_atlas.py --verify
      - name: Test UI and input lifecycle (mock)
        run: lua5.3 tests/smoke.lua
